# Base stack: what runs in the cloud. One VM, two containers, Caddy does TLS.
# `covered up` layers compose.local.yaml on top for the all-local stack.
name: covered
services:
  relayer:
    build: ../relayer
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "8787"
    volumes:
      - config:/config
      - relayer_data:/data
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10
  # Mainnet runs beside testnet on the same VM once .env.mainnet names a contract (`bin/covered serve`
  # enables the profile). Until then the mainnet site says it is not live yet.
  relayer-mainnet:
    profiles: ["mainnet"]
    build: ../relayer
    restart: unless-stopped
    env_file:
      - path: ../.env.mainnet
        required: false
    environment:
      PORT: "8787"
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10
  # One Caddy, two sites: the primary network on $DOMAIN, mainnet on $MAINNET_DOMAIN. TLS is automatic.
  web:
    build: ../web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
      MAINNET_ADDRESS: ${MAINNET_DOMAIN:-http://mainnet.localhost}
    volumes:
      - config:/config:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      relayer:
        condition: service_healthy
      config:
        condition: service_completed_successfully
  # The app's runtime config per network, written from the .env files on every start.
  config:
    image: alpine:3.20
    env_file: ../.env
    environment:
      SWITCH_HOST: ${MAINNET_DOMAIN:-}
    volumes:
      - config:/config
      - ./write-config.sh:/write-config.sh:ro
    command: ["sh", "-c", "/write-config.sh /config/primary.json && /write-config.sh /config/config.json >/dev/null && MODE=mainnet COVERED_ID= /write-config.sh /config/mainnet.json"]
  config-mainnet:
    profiles: ["mainnet"]
    image: alpine:3.20
    env_file:
      - path: ../.env.mainnet
        required: false
    environment:
      SWITCH_HOST: ${DOMAIN:-}
    volumes:
      - config:/config
      - ./write-config.sh:/write-config.sh:ro
    depends_on:
      config: { condition: service_completed_successfully }
    command: ["/write-config.sh", "/config/mainnet.json"]
volumes:
  config:
  relayer_data:
  caddy_data:
