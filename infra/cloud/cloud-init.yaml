#cloud-config
# First boot only prepares the machine: Docker, swap (the contract build wants it on 2 GB), a firewall and a
# `deploy` user. The code arrives with `bin/coveredmarket deploy` (git archive over ssh), so the repo can stay private.
package_update: true
packages: [ca-certificates, curl, ufw]
users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${deploy_pubkey}
write_files:
  - path: /opt/covered/.env
    permissions: "0600"
    content: |
      ${indent(6, env_file)}
runcmd:
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker deploy
  - ufw allow OpenSSH && ufw allow 80 && ufw allow 443 && ufw --force enable
  - chown -R deploy:deploy /opt/covered
  - touch /var/lib/covered-ready
