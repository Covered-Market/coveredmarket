# Local overlay: a NEAR sandbox, a Bitcoin regtest node, the contracts built to wasm,
# and a bootstrap that deploys and wires everything. `covered up` = compose with both files.
services:
  near-sandbox:
    build: ./local/sandbox
    ports: ["3030:3030"]
    volumes:
      - sandbox_home:/home/near/.near
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/status"]
      interval: 5s
      timeout: 3s
      retries: 60
  bitcoind:
    image: bitcoin/bitcoin:29.5
    command: >
      bitcoind -regtest -server -txindex -fallbackfee=0.0001 -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0
      -rpcuser=covered -rpcpassword=covered -printtoconsole
    ports: ["18443:18443"]
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=covered", "-rpcpassword=covered", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 60
  contracts:
    restart: "no"
    build:
      context: ..
      dockerfile: infra/local/contracts.Dockerfile
    volumes:
      - wasm:/out
    command: ["sh", "-c", "cp /build/target/near/*/*.wasm /out/ && ls -la /out"]
  bootstrap:
    restart: "no"
    build: ./local/bootstrap
    depends_on:
      near-sandbox: { condition: service_healthy }
      bitcoind: { condition: service_healthy }
      contracts: { condition: service_completed_successfully }
    volumes:
      - wasm:/wasm:ro
      - sandbox_home:/sandbox:ro
      - config:/config
      - ../params:/params:ro
      - ../.env:/env/.env
    environment:
      NEAR_RPC: http://near-sandbox:3030
      BITCOIN_RPC: http://bitcoind:18443
  relayer:
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    environment:
      BTC_BACKEND: core
      BITCOIN_RPC: http://bitcoind:18443
      BITCOIN_RPC_USER: covered
      BITCOIN_RPC_PASS: covered
      LIGHT_CLIENT_MOCK: "1"
      TICK_MS: "5000"
      FIXED_SPOT_USD: "97420"
  config:
    depends_on:
      bootstrap: { condition: service_completed_successfully }
volumes:
  sandbox_home:
  bitcoin_data:
  wasm:
