name: testnet
# L2 on live NEAR testnet: the real MPC signer (v1.signer-prod.testnet) and the real Bitcoin light client
# (btc-client-v4.testnet, which follows Bitcoin testnet3). Throwaway accounts come from the testnet faucet helper.
on:
  push:
    branches: ["e2e/testnet**", "feat/cloud**"]
  workflow_dispatch:
concurrency:
  group: testnet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm ci && set -o pipefail; node probe-testnet.mjs | tee probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: e2e/probe.txt }
  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: for c in covered mock-btc-client mock-usdc; do cargo near build non-reproducible-wasm --manifest-path contracts/$c/Cargo.toml; done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: (cd relayer && npm ci) && (cd web && npm ci) && (cd e2e && npm ci)
      - run: set -o pipefail; mkdir -p e2e/artifacts && cd e2e && npx tsx testnet.ts | tee artifacts/testnet.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: testnet-l2, path: e2e/artifacts/ }
  # The cloud VM's exact start-up (`bin/covered serve`) on a clean runner: builds the wasm, deploys and locks a fresh
  # testnet contract set via the faucet, starts relayer + web, then creates a visitor wallet through /api/account.
  cloud-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: touch .env && bin/covered serve
      - name: check the running stack
        run: |
          set -euo pipefail
          cat .env | grep -v KEY
          curl -fsS localhost/api/health; echo
          curl -fsS localhost/config.json; echo
          curl -fsS localhost/api/spot | tee /dev/stderr | jq -e '.price > 1000 and .sources >= 1'
          set -a; . ./.env; set +a
          view() { curl -fsS https://rpc.testnet.fastnear.com -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"query\",\"params\":{\"request_type\":\"call_function\",\"finality\":\"optimistic\",\"account_id\":\"$1\",\"method_name\":\"$2\",\"args_base64\":\"$(printf '%s' "$3" | base64 -w0)\"}}" | jq -r '.result.result | implode'; }
          view "$COVERED_ID" get_params '{}' | jq -e '.signer == "v1.signer-prod.testnet" and .light_client == "btc-client-v4.testnet"'
          curl -fsS https://rpc.testnet.fastnear.com -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"query\",\"params\":{\"request_type\":\"view_access_key_list\",\"finality\":\"optimistic\",\"account_id\":\"$COVERED_ID\"}}" | jq -e '.result.keys | length == 0'
          PK=$(node -e "const c=require('crypto');const k=c.generateKeyPairSync('ed25519');const raw=k.publicKey.export({format:'der',type:'spki'}).subarray(12);const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let n=BigInt('0x'+raw.toString('hex')),s='';while(n>0n){s=A[Number(n%58n)]+s;n/=58n}console.log('ed25519:'+s)")
          ID="visitor-$(date +%s).testnet"
          curl -fsS -X POST localhost/api/account -H 'content-type: application/json' -d "{\"newAccountId\":\"$ID\",\"newAccountPublicKey\":\"$PK\"}"; echo
          sleep 3
          view "$USDC_ID" ft_balance_of "{\"account_id\":\"$ID\"}" | jq -e '. == "100000000000"'
          echo "cloud rehearsal OK: $COVERED_ID"
      - name: contract reset, funded by the relayer (no faucet), and visitor wallets while the faucet refuses
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a; OLD=$COVERED_ID; REL=$RELAYER_ID
          sed -i '/^COVERED_ID=/d' .env
          echo 'NEAR_HELPER_URL=https://helper.invalid/account' >> .env
          bin/covered serve
          set -a; . ./.env; set +a
          [ "$COVERED_ID" != "$OLD" ] && [ "$RELAYER_ID" = "$REL" ] && [[ "$COVERED_ID" == *".$REL" ]] || { echo "reset did not fund from the relayer: $COVERED_ID / $RELAYER_ID"; exit 1; }
          curl -fsS localhost/config.json | jq -e --arg c "$COVERED_ID" '.contract == $c'
          PK=$(node -e "const c=require('crypto');const k=c.generateKeyPairSync('ed25519');const raw=k.publicKey.export({format:'der',type:'spki'}).subarray(12);const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let n=BigInt('0x'+raw.toString('hex')),s='';while(n>0n){s=A[Number(n%58n)]+s;n/=58n}console.log('ed25519:'+s)")
          J=$(curl -fsS -X POST localhost/api/account -H 'content-type: application/json' -d "{\"newAccountId\":\"v$(date +%s).testnet\",\"newAccountPublicKey\":\"$PK\"}")
          echo "$J"; echo "$J" | jq -e --arg r ".$REL" '.accountId | endswith($r)'
          echo "reset OK: $OLD -> $COVERED_ID, relayer kept; visitor wallet made without the faucet"
      - if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.testnet.yaml logs --tail=120
