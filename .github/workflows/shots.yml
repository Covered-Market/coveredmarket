name: shots
# Screenshots of the deployed app from its live contract (e2e/shots.mjs): the website shot list, or an audit of
# every page at phone and desktop widths in both themes. Results are the `shots` / `audit` artifact.
on:
  workflow_dispatch:
    inputs:
      site:
        description: the app's URL, e.g. https://testnet.example.com
        required: true
      mode:
        description: shots (S1–S12 for the website) or audit (every page, full length)
        type: choice
        options: [shots, audit]
        default: shots
      seller:
        description: optional — whose "My contracts" page to show
        default: ""
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && SITE="${{ inputs.site }}" MODE="${{ inputs.mode }}" SELLER="${{ inputs.seller }}" node shots.mjs
      - name: publish to the ${{ inputs.mode }}-output branch (readable with git alone)
        if: always()
        run: |
          cd "e2e/artifacts/${{ inputs.mode }}" && git init -q -b out && git add -A
          git -c user.name=shots -c user.email=shots@users.noreply.github.com commit -qm "${{ inputs.mode }} of ${{ inputs.site }} at $(date -u +%FT%TZ) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out:${{ inputs.mode }}-output
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "${{ inputs.mode }}", path: "e2e/artifacts/${{ inputs.mode }}/" }
