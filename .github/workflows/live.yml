name: live
# One full contract on the deployed site with real Bitcoin testnet3 (see e2e/live.ts). On demand only: it spends
# the demo faucet's test coins (and gets them back) and takes one to two hours of real block time.
on:
  workflow_dispatch:
    inputs:
      site:
        description: site URL
        default: https://178-62-225-161.sslip.io
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm ci && mkdir -p artifacts
      - run: set -o pipefail; cd e2e && SITE="${{ inputs.site }}" npx tsx live.ts | tee artifacts/live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live, path: e2e/artifacts/ }
