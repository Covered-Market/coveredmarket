name: live
# One full contract on the deployed site with real Bitcoin testnet3 (see e2e/live.ts). On demand only: it spends
# the demo faucet's test coins (and gets them back) and takes one to two hours of real block time.
# script=seed.ts instead fills the site with a realistic book (e2e/seed.ts): offers for sale, one running,
# one kept, one exercised, one awaiting its deposit.
on:
  workflow_dispatch:
    inputs:
      site:
        description: the app's URL, e.g. https://testnet.example.com
        required: true
      script:
        description: live.ts (one full contract), seed.ts (a realistic book) or take.ts (buy + exercise SERIAL)
        type: choice
        options: [live.ts, seed.ts, take.ts]
        default: live.ts
      serial:
        description: for take.ts — the offer to buy and exercise
        default: ""
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm ci && mkdir -p artifacts
      - run: set -o pipefail; cd e2e && SITE="${{ inputs.site }}" SERIAL="${{ inputs.serial }}" npx tsx "${{ inputs.script || 'live.ts' }}" | tee "artifacts/${{ inputs.script || 'live.ts' }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live, path: e2e/artifacts/ }
