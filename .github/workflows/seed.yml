name: seed
# Fills the deployed testnet site with a realistic book (e2e/seed.ts): offers for sale, one running, one kept,
# one exercised, one awaiting its deposit — all through the live contract, relayer and demo faucet. About an hour.
on:
  workflow_dispatch:
    inputs:
      site:
        description: site URL
        default: https://178-62-225-161.sslip.io
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd e2e && npm ci && mkdir -p artifacts
      - run: set -o pipefail; cd e2e && SITE="${{ inputs.site }}" npx tsx seed.ts | tee artifacts/seed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: seed, path: e2e/artifacts/ }
