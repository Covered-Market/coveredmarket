name: stack
# Boots the whole product with `bin/coveredmarket up` (NEAR sandbox, Bitcoin regtest, contracts, relayer, web)
# and runs `bin/coveredmarket e2e-stack`: both contract lifecycles end to end, the UI, and Verify 7/7.
# This is the README's "Run it yourself" path on a clean machine, on x86-64 and on arm64 (what Docker on an
# Apple Silicon Mac runs). Pull requests skip it when only docs or brand assets change.
on:
  push:
    branches: [main, "e2e/**"]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["docs/**", "brand/**", "scripts/readme/**", "SECURITY.md", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]
  workflow_dispatch:
concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stack:
    name: stack (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: bin/coveredmarket up
        run: bin/coveredmarket up
      - name: browser for the UI checks
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: bin/coveredmarket e2e-stack
        run: bin/coveredmarket e2e-stack
      - name: logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.local.yaml logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens-${{ matrix.arch }}
          path: e2e/artifacts/
          if-no-files-found: ignore
