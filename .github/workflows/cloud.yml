name: cloud
# Provision / deploy / destroy the one-VM deployment on DigitalOcean. Needs two repository secrets:
#   DO_TOKEN        a DigitalOcean API token (read + write)
#   DEPLOY_SSH_KEY  private half of a deploy key: ssh-keygen -t ed25519 -f deploy_key -N "" && gh secret set DEPLOY_SSH_KEY < deploy_key
# Terraform state is carried between runs as the `tfstate` artifact (it holds no secrets: env_file stays empty,
# the VM writes its own .env). Pushing a tag v* redeploys the current VM.
# Optional repository variables (gh variable set NAME --body VALUE), so every run keeps the same site:
#   DOMAIN               the site's domain; the `domain` input overrides it for one run
#   DNS_AT_DIGITALOCEAN  false when DNS stays at the registrar (point @, * and www at the VM's IP there)
on:
  workflow_dispatch:
    inputs:
      action:
        description: apply (create/update + deploy), deploy (code only), reset-contract (deploy + a fresh locked testnet contract) or destroy
        type: choice
        options: [apply, deploy, reset-contract, destroy]
        default: apply
      domain:
        description: optional domain; empty = the DOMAIN repository variable, else <ip>.sslip.io
        type: string
        default: ""
  push:
    tags: ["v*"]
concurrency:
  group: cloud
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_domain: ${{ inputs.domain || vars.DOMAIN }}
      TF_VAR_dns_at_digitalocean: ${{ vars.DNS_AT_DIGITALOCEAN || 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: secrets present
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          bad=0
          if [ -z "$TF_VAR_do_token" ]; then echo "::error::DO_TOKEN is not set"; bad=1
          elif ! [[ "$TF_VAR_do_token" =~ ^dop_v1_[0-9a-f]{64}$ ]]; then echo "::error::DO_TOKEN is set but is not a DigitalOcean token (expected dop_v1_ + 64 hex chars; got ${#TF_VAR_do_token} chars starting '${TF_VAR_do_token:0:3}')"; bad=1
          elif ! curl -fsS -o /dev/null -H "Authorization: Bearer $TF_VAR_do_token" https://api.digitalocean.com/v2/account; then echo "::error::DO_TOKEN is rejected by DigitalOcean"; bad=1; fi
          if [ -z "$KEY" ]; then echo "::error::DEPLOY_SSH_KEY is not set"; bad=1
          elif ! printf '%s\n' "$KEY" | ssh-keygen -y -f /dev/stdin >/dev/null 2>&1; then echo "::error::DEPLOY_SSH_KEY is not a valid private key"; bad=1; fi
          exit $bad
      - name: deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "TF_VAR_deploy_pubkey=$(ssh-keygen -y -f ~/.ssh/deploy)" >> "$GITHUB_ENV"
          echo "DEPLOY_KEY=$HOME/.ssh/deploy" >> "$GITHUB_ENV"
      - name: restore terraform state
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow cloud.yml --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success" or .conclusion=="failure")][].databaseId' | head -20 | while read r; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/artifacts" --jq '.artifacts[] | select(.name=="tfstate" and (.expired|not)) | .workflow_run.id' | head -1; done | head -1)
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n tfstate -D infra/cloud && echo "state from run $id"; else echo "no previous state"; fi
      - run: cd infra/cloud && terraform init -input=false
      - name: apply
        if: env.ACTION == 'apply'
        run: cd infra/cloud && terraform apply -input=false -auto-approve
      - name: destroy
        if: env.ACTION == 'destroy'
        run: cd infra/cloud && terraform destroy -input=false -auto-approve
      - name: deploy
        if: env.ACTION != 'destroy'
        env:
          RESET_CONTRACT: ${{ env.ACTION == 'reset-contract' && '1' || '' }}
          # The mainnet waitlist's inbox (relayer/src/waitlist.ts). Optional: unset, the VM keeps the login it has.
          IMAP_PASS: ${{ secrets.WAITLIST_IMAP_PASS }}
          IMAP_USER: ${{ vars.WAITLIST_IMAP_USER }}
          IMAP_HOST: ${{ vars.WAITLIST_IMAP_HOST }}
          WAITLIST_TO: ${{ vars.WAITLIST_TO }}
        run: bin/coveredmarket deploy
      - name: save terraform state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfstate
          path: infra/cloud/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 90
      - name: summary
        if: env.ACTION != 'destroy'
        run: cd infra/cloud && echo "### $(terraform output -raw url)" >> "$GITHUB_STEP_SUMMARY" && terraform output
