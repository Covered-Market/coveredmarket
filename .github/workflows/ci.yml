name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p covered
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - run: bin/covered build
      - run: cargo test -p integration -- --test-threads=1 --nocapture   # near-workspaces downloads near-sandbox
        env:
          NEAR_RPC_TIMEOUT_SECS: "120"
          RUST_LOG: near_workspaces=debug,near_sandbox_utils=debug,workspaces=debug
      - uses: actions/upload-artifact@v4
        with: { name: wasm, path: target/near/*/*.wasm }
  relayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: relayer/package-lock.json }
      - run: cd relayer && npm ci && npm test && npm run build
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm test && npm run build
  images:
    runs-on: ubuntu-latest
    needs: [relayer, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build relayer && docker build web
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: cd infra/cloud && terraform fmt -check -diff && terraform init -backend=false -input=false && terraform validate
      - run: cp .env.example .env && docker compose -f infra/compose.yaml -f infra/compose.local.yaml config -q && bash -n bin/covered
  local-stack:
    # Builds the local images (sandbox, contract builder, bootstrap) so a broken Dockerfile fails here, not on a laptop.
    runs-on: ubuntu-latest
    needs: [infra]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose -f infra/compose.yaml -f infra/compose.local.yaml build near-sandbox bootstrap contracts
  deploy:
    # Pushes to main redeploy the cloud VM when the secrets exist (DEPLOY_HOST, DEPLOY_SSH_KEY).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [contracts, images, infra]
    steps:
      - uses: actions/checkout@v4
      - name: deploy over ssh
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ]; then echo "no DEPLOY_HOST secret; skipping"; exit 0; fi
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          bin/covered deploy "$HOST" main
