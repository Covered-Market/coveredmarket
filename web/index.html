<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoveredMarket — earn on Bitcoin you still hold</title>
<link rel="icon" href="/favicon.svg">
<meta name="description" content="CoveredMarket: sell covered calls on native Bitcoin. Your coins stay at a Bitcoin address only a NEAR contract can sign for, and the premium is yours whatever happens.">
<meta property="og:title" content="CoveredMarket — Earn on Bitcoin you still hold.">
<meta property="og:description" content="Covered calls on native Bitcoin. No exchange, no custodian. Built on NEAR Chain Signatures.">
<meta property="og:image" content="/site/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f2ead6">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/bundle.css">
<style>
  /* No browser default margin: the pages run edge to edge. */
  html, body { margin: 0; }
  body { background: var(--paper); }
  /* Two-column pages stack on narrow screens; side padding shrinks on phones. */
  @media (max-width: 1100px) { .cv-split { grid-template-columns: minmax(0, 1fr) !important; gap: 32px !important; } }
  @media (max-width: 640px) { .cv-pad { padding-left: 16px !important; padding-right: 16px !important; } }
  .cv-root a:not([class]):not([style]) { color: var(--intaglio); }
  .cv-side .cv-figure--xl { font-size: 36px; line-height: 40px; }
  .cv-side .cv-stat { min-width: 0; }
  /* Phones: header on two rows (nav scrolls), certificate in one column, smaller figures. */
  @media (max-width: 760px) {
    .cv-topbar { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
    .cv-topbar__word { font-size: 20px; }
    .cv-topbar__nav { order: 3; flex: 1 1 100%; gap: 22px; overflow-x: auto; scrollbar-width: none; }
    .cv-topbar__link { white-space: nowrap; }
    .cv-topbar__right { gap: 8px; min-width: 0; }
    .cv-topbar__right .cv-btn { max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
    .cv-cert { padding: 20px 16px; }
    .cv-cert__head { flex-direction: column; align-items: flex-start; gap: 6px; padding-right: 56px; }
    .cv-cert__title { font-size: 24px; line-height: 30px; }
    .cv-cert__body { grid-template-columns: minmax(0, 1fr); }
    .cv-cert__foot { flex-direction: column; align-items: stretch; gap: 16px; }
    .cv-cert__addr { word-break: break-all; }
    .cv-cert__serial { text-align: left; }
    .cv-only-wide { display: none !important; }
    .cv-offer { width: 100%; }
    .cv-figure--xl { font-size: 32px; line-height: 36px; }
    .cv-root h1.display-2 { font-size: 36px !important; }
  }
  @media (min-width: 761px) { .cv-only-narrow { display: none !important; } }
  /* Tabs over a list: four large buttons with an icon, a label and a count; the selected one in solid intaglio. */
  .cv-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .cv-tab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--ink); font: 600 16px/22px var(--font-sans); cursor: pointer; text-align: left; min-width: 0; }
  .cv-tab:hover { border-color: var(--intaglio); }
  .cv-tab__icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--intaglio); }
  .cv-tab__label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv-tab__n { font: 500 13px/1 var(--font-mono); padding: 4px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-muted); }
  .cv-tab--on { background: var(--intaglio); border-color: var(--intaglio); color: var(--on-intaglio); }
  .cv-tab--on .cv-tab__icon { color: var(--on-intaglio); }
  .cv-tab--on .cv-tab__n { background: transparent; border-color: currentColor; color: var(--on-intaglio); }
  .cv-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (max-width: 640px) { .cv-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* An empty list: a dashed box with what will be here and, if any, the next step. */
  .cv-empty { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: center; padding: 18px 16px; border: 1px dashed var(--rule-strong); }
  @media (max-width: 520px) { .cv-empty { grid-template-columns: minmax(0, 1fr); justify-items: start; } }
  /* Portfolio: a list of things waiting on you. */
  .cv-todo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--rule); }
  .cv-todo:first-child { border-top: none; }
  @media (max-width: 520px) { .cv-todo { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 520px) {
    .cv-tiles { display: grid !important; grid-template-columns: minmax(0, 1fr); width: 100%; }
    .cv-tiles > * { min-width: 0; }
    .cv-side .cv-tiles2 { grid-template-columns: minmax(0, 1fr) !important; }
  }
</style>
</head>
<body data-theme="paper">
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
