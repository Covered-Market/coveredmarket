<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoveredMarket — earn on Bitcoin you still hold</title>
<link rel="icon" href="/favicon.svg">
<meta name="description" content="CoveredMarket: sell covered calls on native Bitcoin. Your coins stay at a Bitcoin address only a NEAR contract can sign for, and the premium is yours whatever happens.">
<meta property="og:title" content="CoveredMarket — Earn on Bitcoin you still hold.">
<meta property="og:description" content="Covered calls on native Bitcoin. No exchange, no custodian. Built on NEAR Chain Signatures.">
<meta property="og:image" content="/site/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f2ead6">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/bundle.css">
<style>
  /* No browser default margin: the pages run edge to edge. */
  html, body { margin: 0; }
  body { background: var(--paper); }
  /* Two-column pages stack on narrow screens; side padding shrinks on phones. */
  @media (max-width: 1100px) { .cv-split { grid-template-columns: minmax(0, 1fr) !important; gap: 32px !important; } }
  @media (max-width: 640px) { .cv-pad { padding-left: 16px !important; padding-right: 16px !important; } }
  .cv-root a:not([class]):not([style]) { color: var(--intaglio); }
  .cv-side .cv-figure--xl { font-size: 36px; line-height: 40px; }
  .cv-side .cv-stat { min-width: 0; }
  /* Phones: header on two rows (nav scrolls), certificate in one column, smaller figures. */
  @media (max-width: 760px) {
    .cv-topbar { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
    .cv-topbar__word { font-size: 20px; }
    .cv-topbar__nav { order: 3; flex: 1 1 100%; gap: 22px; overflow-x: auto; scrollbar-width: none; }
    .cv-topbar__link { white-space: nowrap; }
    .cv-topbar__right { gap: 8px; min-width: 0; }
    .cv-topbar__right .cv-btn { max-width: 168px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
    .cv-cert { padding: 20px 16px; }
    .cv-cert__head { flex-direction: column; align-items: flex-start; gap: 6px; padding-right: 56px; }
    .cv-cert__title { font-size: 24px; line-height: 30px; }
    .cv-cert__body { grid-template-columns: minmax(0, 1fr); }
    .cv-cert__foot { flex-direction: column; align-items: stretch; gap: 16px; }
    .cv-cert__addr { word-break: break-all; }
    .cv-cert__serial { text-align: left; }
    .cv-only-wide { display: none !important; }
    .cv-offer { width: 100%; }
    .cv-figure--xl { font-size: 32px; line-height: 36px; }
    .cv-root h1.display-2 { font-size: 36px !important; }
  }
  @media (min-width: 761px) { .cv-only-narrow { display: none !important; } }
  /* Tabs over a list: four large buttons with an icon, a label and a count; the selected one in solid intaglio. */
  .cv-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .cv-tab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--ink); font: 600 16px/22px var(--font-sans); cursor: pointer; text-align: left; min-width: 0; }
  .cv-tab:hover { border-color: var(--intaglio); }
  .cv-tab__icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--intaglio); }
  .cv-tab__label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv-tab__n { font: 500 13px/1 var(--font-mono); padding: 4px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-muted); }
  .cv-tab--on { background: var(--intaglio); border-color: var(--intaglio); color: var(--on-intaglio); }
  .cv-tab--on .cv-tab__icon { color: var(--on-intaglio); }
  .cv-tab--on .cv-tab__n { background: transparent; border-color: currentColor; color: var(--on-intaglio); }
  .cv-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (max-width: 640px) { .cv-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* An empty list: a dashed box with what will be here and, if any, the next step. */
  .cv-empty { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: center; padding: 18px 16px; border: 1px dashed var(--rule-strong); }
  @media (max-width: 520px) { .cv-empty { grid-template-columns: minmax(0, 1fr); justify-items: start; } }
  /* For sale: a two-way switch between the board and the cards. */
  .cv-seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--rule-strong); }
  .cv-seg__b { padding: 8px 16px; border: 0; background: var(--paper-raised); color: var(--ink); font: 600 14px/20px var(--font-sans); cursor: pointer; }
  .cv-seg__b + .cv-seg__b { border-left: 1px solid var(--rule-strong); }
  .cv-seg__b--on { background: var(--intaglio); color: var(--on-intaglio); }
  .cv-seg__b:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* The board: strikes down, expiries across; a cell is the offers at that strike and expiry. */
  .cv-board__scroll { overflow-x: auto; }
  .cv-board { display: grid; gap: 6px; align-items: stretch; min-width: min-content; }
  .cv-board__k, .cv-board__col span, .cv-board__band span, .cv-board__sub { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
  .cv-board__k { align-self: end; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .cv-board__col { display: flex; flex-direction: column; align-items: center; padding-bottom: 4px; font: 600 14px/20px var(--font-sans); }
  .cv-board__band { display: flex; flex-direction: column; justify-content: center; font-size: 15px; line-height: 20px; }
  .cv-board__cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; padding: 8px; border: 1px solid var(--rule); color: var(--ink); cursor: pointer; font: inherit; }
  .cv-board__cell:hover { border-color: var(--intaglio); }
  .cv-board__cell--on { outline: 2px solid var(--intaglio); outline-offset: -2px; border-color: var(--intaglio); }
  .cv-board__cell--none { border-style: dashed; cursor: default; background: transparent; }
  .cv-board__cell--none:hover { border-color: var(--rule); }
  .cv-board__cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cv-board__spot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font: 600 12px/16px var(--font-sans); color: var(--gilt-ink); }
  .cv-board__spot i { flex: 1; border-top: 1px dashed var(--gilt); }
  .cv-ladder { min-width: 860px; }
  .cv-ladder__bar { height: 10px; min-width: 96px; background: var(--paper-sunk); }
  .cv-ladder__bar i { display: block; height: 100%; background: var(--copper); }
  /* Portfolio: a list of things waiting on you. */
  .cv-todo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--rule); }
  .cv-todo:first-child { border-top: none; }
  @media (max-width: 520px) { .cv-todo { grid-template-columns: minmax(0, 1fr); } }
  /* Sell flow: one centered column (header, steps, the current step), never stretched across a wide screen. */
  .cv-flowpage { box-sizing: border-box; width: 100%; max-width: 856px; margin: 0 auto; padding: 32px 48px 48px; display: flex; flex-direction: column; gap: 28px; }
  .cv-panel { border: 1px solid var(--rule); background: var(--paper-raised); padding: 32px; }
  @media (max-width: 640px) { .cv-panel { padding: 20px 16px; } }
  .cv-panel .cv-field__wrap { background: var(--paper); }
  .cv-flow__nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 20px; }
  .cv-review-pair { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .cv-review-pair { grid-template-columns: minmax(0, 1fr); } }
  .cv-outcome { border: 1px solid var(--rule); background: var(--paper); padding: 14px 16px; }
  .cv-panel .cv-terms { background: var(--paper); }
  .cv-panel .cv-choice:not(.cv-choice--on) { background: var(--paper); }
  /* Sell flow: a bar of numbered steps. Done and current in intaglio; each done step shows what you chose. */
  .cv-steps { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .cv-step { min-width: 0; border-top: 3px solid var(--rule-strong); }
  .cv-step--done, .cv-step--now { border-top-color: var(--intaglio); }
  .cv-step__hit { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 10px 2px 0; background: none; border: 0; font: inherit; color: inherit; text-align: left; }
  button.cv-step__hit { cursor: pointer; }
  button.cv-step__hit:hover .cv-step__label { text-decoration: underline; text-underline-offset: 3px; }
  button.cv-step__hit:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cv-step__n { flex: none; width: 24px; height: 24px; border-radius: 999px; display: inline-grid; place-items: center; font: 500 12px/1 var(--font-mono); border: 1px solid var(--rule-strong); color: var(--ink-muted); background: var(--paper); }
  .cv-step--done .cv-step__n { background: var(--intaglio); border-color: var(--intaglio); color: var(--on-intaglio); }
  .cv-step--now .cv-step__n { border: 2px solid var(--intaglio); color: var(--intaglio); font-weight: 700; }
  .cv-step__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 3px; }
  .cv-step__label { font: 600 13px/18px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv-step--now .cv-step__label { color: var(--ink); }
  .cv-step--done .cv-step__label { color: var(--ink); }
  .cv-step__val { font: 500 12px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) { .cv-step__text { display: none; } .cv-step__hit { justify-content: center; } }
  /* Sell flow: large one-of-many choices (expiry). */
  .cv-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); gap: 8px; }
  .cv-choice { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
  .cv-choice:hover { border-color: var(--intaglio); }
  .cv-choice:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cv-choice__main { font: 600 16px/22px var(--font-sans); }
  .cv-choice__sub { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
  .cv-choice--on { background: var(--intaglio); border-color: var(--intaglio); color: var(--on-intaglio); }
  .cv-choice--on .cv-choice__sub { color: var(--on-intaglio); opacity: 0.85; }
  /* Sell flow: the terms on the review step, each with a way back to its step. */
  .cv-terms { margin: 0; border: 1px solid var(--rule); background: var(--paper-raised); }
  .cv-terms__row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--rule); }
  .cv-terms__row:first-child { border-top: none; }
  @media (max-width: 520px) { .cv-terms__row { grid-template-columns: minmax(0, 1fr) auto; } .cv-terms__row dd { grid-column: 1 / -1; grid-row: 2; } }
  @media (max-width: 520px) {
    .cv-tiles { display: grid !important; grid-template-columns: minmax(0, 1fr); width: 100%; }
    .cv-tiles > * { min-width: 0; }
    .cv-side .cv-tiles2 { grid-template-columns: minmax(0, 1fr) !important; }
  }
</style>
</head>
<body data-theme="paper">
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
